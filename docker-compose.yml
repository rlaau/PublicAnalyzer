services:
  streamable:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamable
    # 루트 권한으로 실행 (각종 파일 권한 문제 해결. 특히 도커)
    user: "1000:1000"
    ports:
      - "8080:8080"
    #WORKDIR:- /app <- 도커 파일에서 정의했음
    environment:
      - DOCKER_ROOT=/app

    volumes:
      - .:/app
      # 프로덕션 환경에선 /app전체 볼륨 대신, 아래만 볼륨 처리
      #- ./storage:/app/storage
      #- ./stream_storage:/app/stream_storage
      #- ./web:/app/web
    restart: "no"
    # user/local/bin/streamble실행
    command: streamable
    #restart: unless-stopped



  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      # nc 없이 TCP 포트 열림만 확인 (bash의 /dev/tcp 사용)
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2181'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.4.3
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      # 호스트에서 Go 앱을 돌릴 거면 localhost:9092 광고
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
