syntax = "proto3";

package ropedb_proto;
option go_package = "github.com/rlaaudgjs5638/chainAnalyzer/shared/dblib/ropedb/proto";

// 큰 숫자를 위한 최적화된 구조체
message BigInt {
    bytes data = 1; // big.Int의 GobEncode 결과
}

message Int128 {
    uint64 high = 1;
    uint64 low = 2;
    bool negative = 3;
}

// TraitMark Proto 버전
message TraitMarkProto {
    repeated uint32 author_codes = 1;
    string last_tx = 2;
    uint64 trait_id = 3;
    uint32 trait = 4;
    string address_a = 5;
    uint32 rule_a = 6;
    string address_b = 7;
    uint32 rule_b = 8;
    double score = 9;
    uint32 volume = 10;
    Int128 value_or_null = 11; // decimal을 int128로 최적화
    int64 last_seen = 12; // Unix timestamp
}

// RopeMark Proto 버전
message RopeMarkProto {
    uint64 rope_id = 1;
    uint32 trait = 2;
    uint32 size = 3;
    repeated string members = 4;
    uint32 volume = 5;
    Int128 value_or_null = 6;
    int64 last_seen = 7;
    repeated TrapVertexProto trap_vertices = 8;
}

message TrapVertexProto {
    string address = 1;
    uint32 trap = 2;
}

// PolyRopeMark Proto 버전
message PolyRopeMarkProto {
    uint64 poly_rope_id = 1;
    uint32 poly_trait = 2;
    repeated uint64 ropes = 3;
}

// Vertex Proto 버전
message VertexProto {
    string address = 1;
    repeated RopeRefProto ropes = 2;
    repeated TraitRefProto traits = 3;
    repeated PolyRopeRefProto poly_ropes = 4;
    repeated uint32 traps = 5; // SatisfyingTraps ([]TrapCode)
}

message RopeRefProto {
    uint64 id = 1;
    uint32 trait = 2;
}

message TraitRefProto {
    uint64 trait_id = 1;
    uint32 trait = 2;
    string partner = 3;
    uint32 my_rule = 4;
    uint32 partner_rule = 5;
}

message PolyRopeRefProto {
    uint64 id = 1;
    uint32 poly_trait = 2;
}